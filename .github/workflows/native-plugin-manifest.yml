name: Fork + native development plugin manifest validation
on:
  push:
    branches: [feat/native-caelestia-panel-v2, feat/upstream-plugin-dev-20261021]
  pull_request:
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production and development manifests without breaking current fork
        run: |
          python3 - <<'PYCODE'
          import json, re
          from pathlib import Path
          prod=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          dev=json.loads(Path("manifest.native-dev.json").read_text(encoding="utf-8"))
          assert not prod.get("requires"), "Production manifest must not gate current fork"
          assert dev.get("requires")==">=2.1.0", "Experimental version requirement missing"
          assert (prod["name"],prod["author"])==(dev["name"],dev["author"])
          allowed={"custom","bar-entry","bar-popout","quick-toggle","status-icon","dashboard-tab"}
          def check(m,types):
              for key in ("name","author"):
                  assert re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*",m[key]),key
              assert isinstance(m["version"],str) and m["version"]
              for entry in m.get("entryPoints",[]):
                  assert entry["type"] in types,entry
                  p=Path(entry["source"])
                  assert p.is_file() and not p.is_absolute() and ".." not in p.parts,p
              for key in ("settings","settingsUi"):
                  if key in m:
                      p=Path(m[key])
                      assert p.is_file() and not p.is_absolute() and ".." not in p.parts,p
          check(prod,allowed|{"shell-panel"})
          check(dev,allowed)
          for ep in dev.get("entryPoints",[]):
              assert ep in prod.get("entryPoints",[]),("Missing fork equivalent",ep)
          print("Validated compatible fork root and experimental development profile")
          PYCODE
  shell-host-compat:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check custom backend host patch against pinned upstream development commit
        run: |
          git clone --quiet https://github.com/caelestia-dots/shell.git upstream
          git -C upstream checkout --quiet --detach 4e288c54a3b039154d19fe8a2064a174eb634405
          git -C upstream apply --check ../integration/experimental-shell-custom-host.patch
          git -C upstream apply ../integration/experimental-shell-custom-host.patch
          git -C upstream diff --check
          git -C upstream apply --reverse --check ../integration/experimental-shell-custom-host.patch
          echo "Experimental shell host patch applies cleanly and can be reverted."

  plugin-page-preview:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native plugin-manager page preview on pinned upstream
        run: |
          git clone --quiet https://github.com/caelestia-dots/shell.git upstream
          git -C upstream checkout --quiet --detach 4e288c54a3b039154d19fe8a2064a174eb634405
          cp integration/nexus/PluginsPage.qml upstream/modules/nexus/pages/PluginsPage.qml
          git -C upstream diff --check
          grep -Fq 'Plugins.plugins' upstream/modules/nexus/pages/PluginsPage.qml
          grep -Fq 'Plugins.setPluginEnabled' upstream/modules/nexus/pages/PluginsPage.qml
          if grep -Fq 'Example plugin' upstream/modules/nexus/pages/PluginsPage.qml; then exit 1; fi
          echo 'Native plugin-manager page preview has no placeholder plugin records.'

  release-packager:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fork/upstream release safety and rollback invariants
        run: python3 -m unittest integration/test_prepare_native_release.py -v

  release-packaging-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fork/upstream packaging and no-leak safeguards
        run: python3 -m unittest discover -s integration/tests -v

  reversible-device-rollout:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic deployment, rollback, and fail-closed checks
        run: python3 -m unittest integration/tests/test_device_deployment.py -v
